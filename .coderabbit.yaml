# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        This crate is a PUBLIC CONTRACT consumed by other repos (see linked repositories).
        - Renaming/removing/retyping any `pub` item or serde field is a BREAKING change.
          It requires: a semver bump in Cargo.toml, a CHANGELOG.md entry, and
          `#[serde(alias = "...")]` or a deprecation window. Name the consumer files that break.
        - Money is integer minor units only. Flag any f32/f64 in public types.
        - No `unwrap()`/`expect()` outside tests.
    - path: "CHANGELOG.md"
      instructions: "Every public API change must have an entry under the version in Cargo.toml."
  pre_merge_checks:
    title:
      mode: warning
      requirements: "Start with feat:, fix:, or breaking: and reference a PAY-### ticket."
  tools:
    clippy:
      enabled: true
knowledge_base:
  learnings:
    scope: local
  linked_repositories:
    - repository: devopsmayur/rust
      instructions: |
        payments-service: the main consumer of this crate. Builds ChargeRequest/Money,
        calls validate_charge, and implements refunds. Check it for breakage whenever a
        public item or serde field here changes.
